plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

def frontendDir = file('../front_end')
def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
	workingDir = frontendDir
	commandLine npm, 'install'
	onlyIf { !new File(frontendDir, 'node_modules').exists() }
}

tasks.register('buildFrontend', Exec) {
	dependsOn 'npmInstall'
	workingDir = frontendDir
	commandLine npm, 'run', 'build'
	inputs.dir(new File(frontendDir, 'src'))
	inputs.files(
			new File(frontendDir, 'index.html'),
			new File(frontendDir, 'vite.config.js'),
			new File(frontendDir, 'package.json'),
			new File(frontendDir, 'package-lock.json'))
	outputs.dir(new File(frontendDir, 'dist'))
}

tasks.named('bootJar') {
	dependsOn 'buildFrontend'
	from(new File(frontendDir, 'dist')) {
		into 'BOOT-INF/classes/static'
	}
}
