spring.application.name=tetris

# 프로필을 지정하지 않으면 local(H2)로 실행한다
spring.profiles.default=local

# JPA
spring.jpa.open-in-view=false

# 랭킹 조회 캐시 (Caffeine). 점수가 저장되면 ScoreService가 비운다.
spring.cache.type=caffeine
spring.cache.cache-names=topScores
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=60s
