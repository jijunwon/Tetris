# MySQL. 비밀번호는 코드에 쓰지 않고 환경변수 DB_PASSWORD로만 받는다
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tetris}
spring.datasource.username=${DB_USERNAME:tetris}
spring.datasource.password=${DB_PASSWORD}

# MySQL은 기본값이 none이라 테이블을 만들지 않는다
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
