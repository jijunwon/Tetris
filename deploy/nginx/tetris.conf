# /etc/nginx/sites-available/tetris 로 복사한 뒤 sites-enabled에 연결한다.
# 도메인·인증서 경로는 운영 환경에 맞게 둔다.

upstream tetris_app {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP → HTTPS (certbot이 만든 리다이렉트가 있으면 그쪽을 유지해도 된다)
server {
    listen 80;
    listen [::]:80;
    server_name jijunwon-tetris.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name jijunwon-tetris.duckdns.org;

    # certbot이 채운 경로를 그대로 쓴다
    ssl_certificate     /etc/letsencrypt/live/jijunwon-tetris.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jijunwon-tetris.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # JS·CSS 등 텍스트 응답 압축
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    limit_req_status 429;

    # 로그인
    location = /api/auth/login {
        limit_req zone=tetris_auth burst=5 nodelay;
        proxy_pass http://tetris_app;
        include /etc/nginx/snippets/tetris-proxy.conf;
    }

    # 가입
    location = /api/auth/signup {
        limit_req zone=tetris_auth burst=5 nodelay;
        proxy_pass http://tetris_app;
        include /etc/nginx/snippets/tetris-proxy.conf;
    }

    # 점수 저장만 제한 (exact match). /api/scores/top 은 아래 /api/ 로 간다.
    location = /api/scores {
        limit_req zone=tetris_scores burst=10 nodelay;
        proxy_pass http://tetris_app;
        include /etc/nginx/snippets/tetris-proxy.conf;
    }

    # 그 외 API (랭킹 조회 포함)
    location /api/ {
        proxy_pass http://tetris_app;
        include /etc/nginx/snippets/tetris-proxy.conf;
    }

    # Vite 해시 붙은 정적 파일 — 내용이 바뀌면 파일 이름도 바뀌므로 1년 캐시
    location /assets/ {
        proxy_pass http://tetris_app;
        include /etc/nginx/snippets/tetris-proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 새 빌드를 바로 받게 캐시하지 않음
    location = /index.html {
        proxy_pass http://tetris_app;
        include /etc/nginx/snippets/tetris-proxy.conf;
        add_header Cache-Control "no-store";
    }

    location / {
        proxy_pass http://tetris_app;
        include /etc/nginx/snippets/tetris-proxy.conf;
        # SPA 진입: HTML은 짧게만 두거나 no-store
        add_header Cache-Control "no-store";
    }
}
