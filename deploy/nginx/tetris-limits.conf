# /etc/nginx/conf.d/ 에 두고 Nginx를 다시 읽힌다.
# IP당 요청 수 제한 구역 (http 컨텍스트)

# 로그인·가입: 분당 5회 (무차별 대입·대량 가입 완화)
limit_req_zone $binary_remote_addr zone=tetris_auth:10m rate=5r/m;

# 점수 저장: 분당 20회 (랭킹 도배 완화). 조회(/api/scores/top)는 여기에 안 넣는다.
limit_req_zone $binary_remote_addr zone=tetris_scores:10m rate=20r/m;
